<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Icons: white tile + cyan mark (scripts/make-imessage-icon.mjs).
       ?v= cache-busts Facebook / iMessage scrapers after icon changes. -->
  <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
  <link rel="manifest" href="/site.webmanifest?v=4" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO:BEGIN — everything between these markers is replaced per-route by
       scripts/prerender-meta.mjs at build time. These tags are the homepage /
       SPA-fallback defaults; per-page values live in src/seo/routeMeta.js. -->
  <title>Famlink</title>
  <meta name="description"
    content="Famlink helps families find and split a trusted nanny share nearby — match with families and caregivers for affordable, high-quality care." />

  <!-- Compact share card: square white brand tile (not a 1200×630 banner). -->
  <meta property="og:title" content="Find your Nanny Share" />
  <meta property="og:description" content="famlink.care" />
  <meta property="og:url" content="https://famlink.care/" />
  <meta property="og:site_name" content="Famlink" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://famlink.care/icon-512.png?v=4" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="Famlink" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Find your Nanny Share" />
  <meta name="twitter:description" content="famlink.care" />
  <meta name="twitter:image" content="https://famlink.care/icon-512.png?v=4" />
  <!-- SEO:END -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
<script src="https://accounts.google.com/gsi/client" async defer></script>

</html>
