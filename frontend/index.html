<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./src/assets/images/logo3.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Famlink</title>
  <meta name="description"
    content="Famlink helps families find and split a trusted nanny share nearby — match with families and caregivers for affordable, high-quality care." />

  <!-- Open Graph / Social Media Link Preview Tags -->
  <!-- iMessage renders og:title as the caption under the image, so the full tagline lives there. -->
  <meta property="og:title" content="Nanny Share Made Simple. Start Your Share Today" />
  <meta property="og:description"
    content="Famlink helps families find and split a trusted nanny share nearby — match with families and caregivers for affordable, high-quality care." />
  <!-- Rename this file (…-v2, -v3) whenever the artwork changes; iMessage and Slack cache the image per URL. -->
  <meta property="og:image" content="https://famlink.care/social-preview-v2.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Famlink — Nanny Share Made Simple. Start Your Share Today" />
  <meta property="og:url" content="https://famlink.care/" />
  <meta property="og:site_name" content="Famlink" />
  <meta property="og:type" content="website" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nanny Share Made Simple. Start Your Share Today" />
  <meta name="twitter:description"
    content="Famlink helps families find and split a trusted nanny share nearby — match with families and caregivers for affordable, high-quality care." />
  <meta name="twitter:image" content="https://famlink.care/social-preview-v2.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
<script src="https://accounts.google.com/gsi/client" async defer></script>

</html>
